modLoader = "javafml"
loaderVersion = "[47,)"
license = "ARR"

[[mods]]
modId = "touhou_spell"
version = "1.0.0"
displayName = "touhou spell"
authors = "zxyume"
description = '''东方法术（Touhou Spell）: a danmaku school for Iron's Spells 'n Spellbooks, built on Youkais' Homecoming's danmaku entities.

Content (all in the "touhou_spell" namespace):
 - the "万花币" (Kaleido Coin) staff: right click fires danmaku, Ctrl + use opens the ammo
   panel, three Better Combat attack animations, mana regeneration +30%;
 - the "弹幕学手册" (danmaku grimoire): 3 locked innate spells, mana regeneration +75%,
   spell-slot upgrades are blocked;
 - spells: 火力提升 (Firepower Up, 3 levels), 火力全开 (Full Firepower), 飞行术 (Flight,
   2 levels) and 使用符卡 (cast spell card);
 - the spell card curio slot, and the danmaku school with its own "danmaku spell power"
   attribute;
 - the maid armour set (jacket / skirt / shoes): danmaku spell power bonus, max mana and
   mana regeneration, smithed from leather armour;
 - one Iron's Spells upgrade orb type (danmaku), datapack driven and craftable.

Requires: Iron's Spells 'n Spellbooks, Youkais' Homecoming, Curios API, GeckoLib and
Touhou Little Maid. Better Combat is optional (only the staff's attack data uses it).'''


[[dependencies.touhou_spell]]
    modId = "forge"
    mandatory = true
    versionRange = "[47,)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.touhou_spell]]
    modId = "minecraft"
